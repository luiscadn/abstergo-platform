services:
  postgres:
    image: postgres:16-alpine
    container_name: mi_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecreto
      POSTGRES_DB: mi_base_datos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
